services:
  - type: web
    name: peiwan-rank
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_USERNAME
        value: admin
      # 首次部署时 Render 会提示你填写；也可改为 generateValue: true 自动生成
      - key: ADMIN_PASSWORD
        sync: false
      # 由 Render 托管的免费 PostgreSQL（创建后自动注入连接串）
      - key: DATABASE_URL
        fromDatabase:
          name: peiwan-db
          property: connectionString
      # 允许的后台写操作来源（同源请求自动放行，此处额外放行 Render 域名）
      - key: TRUSTED_ORIGINS
        value: https://peiwan-rank.onrender.com,https://*.onrender.com

databases:
  - name: peiwan-db
    plan: free
    databaseName: peiwan
    user: peiwan
